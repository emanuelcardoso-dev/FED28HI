<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>Warmups</title>
    <link rel="stylesheet" href="styles.css">
  </head>

  <body>
    <h1>Warmups</h1>
    <div>
        <div class="yellowBox">
        </div>
        <br/>
    </div>
    <h1>GRID 3x3</h1>
    <div>
      <div class="grid-container">
          <div class="element-1">1</div>
          <div class="element-2">2</div>
          <div class="element-3">3</div>
          <div class="element-4">4</div>
          <div class="element-5">5</div>
          <div class="element-6">6</div>
          <div class="element-7">7</div>
          <div class="element-8">8</div>
      </div>
    </div>
    <h1>FLEXBOX</h1>
    <div class="flex-container">
      <p> center text </p>
    </div>
    <br/>
    <div class="flex-grid-container">
      <div class="flex-item">1</div>
      <div class="flex-item" style="width:300px !important">2</div>
      <div class="flex-item" style="height:120px !important">3</div>
      <div class="flex-item">4</div>
      <div class="flex-item" style="height:180px !important">5</div>
      <div class="flex-item">6</div>
    </div>
  </body>
</html>
